# Nginx location block for PostcodeTracker
# Add this to your nginx server block for rickys.ddns.net

# Main location block for PostcodeTracker API
location /LocationApp/ {
    # Proxy to Docker container
    proxy_pass http://127.0.0.1:8005;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Handle WebSocket connections (if needed in future)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings for better performance
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Don't buffer large responses
    proxy_max_temp_file_size 0;
    
    # Enable compression
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
}

# Optional: Redirect root to LocationApp (if you want rickys.ddns.net/ to redirect to the app)
location = / {
    return 301 /LocationApp/;
}

# Optional: Health check endpoint for monitoring
location /health {
    proxy_pass http://127.0.0.1:8005/LocationApp/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Quick timeouts for health checks
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
} 