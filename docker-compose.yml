version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ${DOCKER_HUB_USERNAME}/postcode-tracker-app:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      # Database configuration
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      
      # Flask configuration
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      
      # Gunicorn configuration (optional overrides)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Optional: Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    command: gunicorn --config gunicorn.conf.py app:app

volumes:
  postgres_data: